<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TravelMate Recommendations</title>

<link rel="stylesheet" href="css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body class="recommend-page">

<header class="navbar">
<div class="logo">
<i class="fa-solid fa-earth-asia"></i>
<div>
<h2>TravelMate</h2>
<p>Your Smart Travel Companion</p>
</div>
</div>

<nav>
<a href="index.html">Home</a>
<a href="features.html">Features</a>
<a href="recommendations.html" class="active">Recommendations</a>
</nav>

<a href="planner.html" class="nav-btn">Plan My Journey</a>
</header>

<section class="recommend-hero">

<span class="badge">Nearby Explorer</span>

<h1>Find What's Around You</h1>

<p>
Discover restaurants, hotels, cafés, attractions and shopping
near your destination within your preferred distance.
</p>

</section>

<section class="recommend-search">

<div class="search-box">

<input
id="searchLocation"
type="text"
placeholder="Search city or destination">

<button id="nearMeBtn">
<i class="fa-solid fa-location-crosshairs"></i>
Near Me
</button>

</div>

<div class="filters">

<select id="distanceFilter">
<option value="5">Within 5 km</option>
<option value="10" selected>Within 10 km</option>
<option value="15">Within 15 km</option>
<option value="25">Within 25 km</option>
</select>

<select id="categoryFilter">
<option value="all">All</option>
<option value="restaurant">Restaurants</option>
<option value="hotel">Hotels</option>
<option value="cafe">Cafés</option>
<option value="attraction">Attractions</option>
<option value="shopping">Shopping</option>
</select>

<button id="searchBtn">Search</button>

</div>

</section>

<section class="recommend-results">

<div class="result-header">
<h2>Nearby Recommendations</h2>
<span id="resultCount">6 places found</span>
</div>

<div id="resultsGrid" class="recommend-grid"></div>

</section>

<script src="js/recommendations.js"></script>

</body>
</html>
