<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plan Your Journey | TravelMate</title>

<link rel="stylesheet" href="css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body class="planner-page">

<header class="planner-navbar">

<a href="index.html" class="planner-logo">
    TravelMate
</a>

</header>

<main class="planner-container">

<section class="planner-header">

<h1 data-key="title">PLAN YOUR JOURNEY</h1>

<p data-key="subtitle">Tell us a little about your trip</p>

</section>

<form id="plannerForm" class="planner-form">

<div class="form-group">

<label data-key="languageLabel">Language</label>

<input
id="language"
list="languageList"
value="English"
placeholder="Search your language..."
autocomplete="off"
required>

<datalist id="languageList">
<option value="English">
<option value="Hindi">
<option value="Telugu">
<option value="Tamil">
<option value="Kannada">
<option value="Malayalam">
<option value="Marathi">
<option value="Bengali">
<option value="Gujarati">
<option value="Punjabi">
<option value="Urdu">
<option value="Japanese">
<option value="Chinese">
<option value="Korean">
<option value="French">
<option value="Spanish">
<option value="Italian">
<option value="German">
<option value="Portuguese">
<option value="Russian">
<option value="Arabic">
<option value="Thai">
<option value="Turkish">
<option value="Vietnamese">
<option value="Dutch">
<option value="Greek">
<option value="Swahili">
</datalist>

</div>

<div class="form-group">

<label data-key="destination">Destination</label>

<input
type="text"
id="destination"
placeholder="Country or city..."
required>

</div>

<div class="form-group">

<label data-key="duration">Trip Duration</label>

<div class="duration-box">

<button type="button" id="decreaseDays">−</button>

<input type="number" id="duration" value="3" readonly>

<button type="button" id="increaseDays">+</button>

</div>

</div>

<div class="form-group">

<label data-key="date">Travel Date</label>

<input type="date" id="travelDate" required>

</div>

<div class="form-group">

<label data-key="budget">Budget</label>

<input type="number" id="budget" placeholder="Enter amount" required>

</div>

<div class="form-group">

<label data-key="interests">Interests</label>

<div class="interest-grid">

<label class="interest-chip"><input type="checkbox" name="interest" value="Food"> Food</label>
<label class="interest-chip"><input type="checkbox" name="interest" value="History"> History</label>
<label class="interest-chip"><input type="checkbox" name="interest" value="Culture"> Culture</label>
<label class="interest-chip"><input type="checkbox" name="interest" value="Shopping"> Shopping</label>
<label class="interest-chip"><input type="checkbox" name="interest" value="Nature"> Nature</label>
<label class="interest-chip"><input type="checkbox" name="interest" value="Adventure"> Adventure</label>
<label class="interest-chip"><input type="checkbox" name="interest" value="Nightlife"> Nightlife</label>
<label class="interest-chip"><input type="checkbox" name="interest" value="Photography"> Photography</label>

</div>

</div>

<button class="generate-button" type="submit">

<span data-key="continue">
Generate My Itinerary
</span>

</button>

</form>

</main>

<script src="js/planner-language.js"></script>
<script src="js/planner.js"></script>

</body>
</html>
