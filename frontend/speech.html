<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Multilingual Translator</title>
  <link rel="stylesheet" href="speech.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>🌐 Multilingual Translator</h1>
      <p class="subtitle">Text • Image • Voice</p>
    </header>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab active" data-tab="text">📝 Text</button>
      <button class="tab" data-tab="image">🖼️ Image</button>
      <button class="tab" data-tab="voice">🎙️ Voice</button>
    </div>

    <!-- ===================== TEXT TRANSLATION ===================== -->
    <div class="panel active" id="panel-text">
      <div class="card">
        <div class="row">
          <div>
            <label>Source Language</label>
            <select id="text-source">
              <option value="auto">Auto Detect</option>
              <option value="en">English</option>
              <option value="hi">Hindi</option>
              <option value="te">Telugu</option>
              <option value="ta">Tamil</option>
              <option value="kn">Kannada</option>
              <option value="ml">Malayalam</option>
              <option value="bn">Bengali</option>
              <option value="mr">Marathi</option>
              <option value="gu">Gujarati</option>
              <option value="pa">Punjabi</option>
            </select>
          </div>
          <div>
            <label>Target Language</label>
            <select id="text-target">
              <option value="en">English</option>
              <option value="hi">Hindi</option>
              <option value="te">Telugu</option>
              <option value="ta">Tamil</option>
              <option value="kn">Kannada</option>
              <option value="ml">Malayalam</option>
              <option value="bn">Bengali</option>
              <option value="mr">Marathi</option>
              <option value="gu">Gujarati</option>
              <option value="pa">Punjabi</option>
              <option value="es">Spanish</option>
              <option value="fr">French</option>
              <option value="de">German</option>
              <option value="ja">Japanese</option>
              <option value="ko">Korean</option>
              <option value="ar">Arabic</option>
              <option value="zh-CN">Chinese</option>
              <option value="ru">Russian</option>
            </select>
          </div>
        </div>

        <label>Enter Text</label>
        <textarea id="text-input" placeholder="Type text to translate..."></textarea>

        <div class="btn-group">
          <button class="btn btn-primary" id="text-translate-btn">Translate</button>
          <button class="btn btn-outline" id="text-speak-btn">🔊 Speak Translation</button>
        </div>

        <div id="text-status" class="status"></div>

        <div id="text-result" class="hidden">
          <div class="result-label">Translated Text</div>
          <div class="result-box" id="text-output"></div>
        </div>
      </div>
    </div>

    <!-- ===================== IMAGE TRANSLATION ===================== -->
    <div class="panel" id="panel-image">
      <div class="card">
        <div class="row">
          <div>
            <label>Target Language</label>
            <select id="image-target">
              <option value="en">English</option>
              <option value="hi">Hindi</option>
              <option value="te">Telugu</option>
              <option value="ta">Tamil</option>
              <option value="kn">Kannada</option>
              <option value="ml">Malayalam</option>
              <option value="bn">Bengali</option>
              <option value="mr">Marathi</option>
              <option value="gu">Gujarati</option>
              <option value="pa">Punjabi</option>
            </select>
          </div>
        </div>

        <div class="upload-zone" id="image-dropzone">
          <p>📷 Click or drag an image here</p>
          <input type="file" id="image-file" accept="image/*" class="hidden" />
        </div>

        <div id="image-preview" class="hidden">
          <div class="image-canvas-wrapper">
            <img id="image-preview-img" alt="Preview" />
            <canvas id="image-canvas"></canvas>
          </div>
        </div>

        <div class="btn-group">
          <button class="btn btn-primary" id="image-translate-btn" disabled>Translate Image</button>
        </div>

        <div id="image-status" class="status"></div>

        <div id="image-result" class="hidden">
          <div class="result-label">Detected Text</div>
          <div class="result-box" id="image-original"></div>

          <div class="result-label" style="margin-top:14px;">Translated Text</div>
          <div class="result-box" id="image-translated"></div>

          <div class="result-label" style="margin-top:14px;">Detected Regions</div>
          <div id="image-regions" class="regions-list"></div>
        </div>
      </div>
    </div>

    <!-- ===================== VOICE TRANSLATION ===================== -->
    <div class="panel" id="panel-voice">
      <div class="card">
        <div class="row">
          <div>
            <label>Source Language</label>
            <select id="voice-source">
              <option value="auto">Auto Detect</option>
              <option value="en">English</option>
              <option value="hi">Hindi</option>
              <option value="te">Telugu</option>
              <option value="ta">Tamil</option>
              <option value="kn">Kannada</option>
              <option value="ml">Malayalam</option>
              <option value="bn">Bengali</option>
              <option value="mr">Marathi</option>
            </select>
          </div>
          <div>
            <label>Target Language</label>
            <select id="voice-target">
              <option value="en">English</option>
              <option value="hi">Hindi</option>
              <option value="te">Telugu</option>
              <option value="ta">Tamil</option>
              <option value="kn">Kannada</option>
              <option value="ml">Malayalam</option>
              <option value="bn">Bengali</option>
              <option value="mr">Marathi</option>
              <option value="gu">Gujarati</option>
              <option value="pa">Punjabi</option>
              <option value="es">Spanish</option>
              <option value="fr">French</option>
              <option value="de">German</option>
              <option value="ja">Japanese</option>
              <option value="ko">Korean</option>
              <option value="ar">Arabic</option>
              <option value="zh-CN">Chinese</option>
              <option value="ru">Russian</option>
            </select>
          </div>
        </div>

        <div class="btn-group">
          <button class="btn btn-primary" id="voice-record-btn">🎤 Start Recording</button>
          <button class="btn btn-outline" id="voice-upload-btn">📁 Upload Audio</button>
          <input type="file" id="voice-file" accept="audio/*" class="hidden" />
        </div>

        <div id="voice-status" class="status"></div>

        <div id="voice-result" class="hidden">
          <div class="result-label">Original Text</div>
          <div class="result-box" id="voice-original"></div>

          <div class="result-label" style="margin-top:14px;">Translated Text</div>
          <div class="result-box" id="voice-translated"></div>

          <div class="result-label" style="margin-top:14px;">Translated Audio</div>
          <audio id="voice-audio" controls></audio>

          <div class="btn-group" style="margin-top: 12px;">
            <button class="btn btn-outline" id="voice-download-btn">⬇️ Download Audio</button>
          </div>
        </div>
      </div>

      <!-- Text to Speech -->
      <div class="card" style="margin-top: 16px;">
        <h3>🔊 Text → Speech</h3>
        <label>Text</label>
        <textarea id="tts-text" placeholder="Type text to convert to speech..."></textarea>

        <div class="row" style="margin-top:12px;">
          <div>
            <label>Language</label>
            <select id="tts-lang">
              <option value="en">English</option>
              <option value="hi">Hindi</option>
              <option value="te">Telugu</option>
              <option value="ta">Tamil</option>
              <option value="kn">Kannada</option>
              <option value="ml">Malayalam</option>
              <option value="bn">Bengali</option>
              <option value="mr">Marathi</option>
            </select>
          </div>
        </div>

        <div class="btn-group">
          <button class="btn btn-primary" id="tts-btn">Generate Speech</button>
          <button class="btn btn-outline hidden" id="tts-download-btn">⬇️ Download Audio</button>
        </div>

        <div id="tts-status" class="status"></div>
        <div id="tts-result" class="hidden">
          <audio id="tts-audio" controls></audio>
        </div>
      </div>
    </div>
  </div>

  <script src="speech.js"></script>
</body>
</html>
