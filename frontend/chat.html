<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#5b43e8"
    >

    <title>
        TravelMate · AI Travel Assistant
    </title>

    <link
    rel="icon"
    type="image/webp"
    href="/static/images/logo.webp"
    >

    <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <link
        rel="stylesheet"
        href="/static/css/chat.css"
    >

</head>


<body>

<div class="chat-app">


    <!-- =====================================================
         TOP NAVBAR
    ====================================================== -->

   <header class="top-navbar">

    <a href="/" class="brand">

        <div class="brand-icon">
            <i class="fa-solid fa-plane"></i>
        </div>

        <div class="brand-text">
            <div class="brand-name">TravelMate</div>
            <div class="brand-sub">Your AI Travel Assistant</div>
        </div>

    </a>


    <nav class="nav-links">

        <a href="/" class="nav-link">
            Home
        </a>

        <a href="/planner.html" class="nav-link">
            Planner
        </a>

        <a href="/translation.html" class="nav-link">
            Translator
        </a>

        <a href="/chat.html" class="nav-link active">
            AI Assistant
        </a>

        <a href="/emergency.html" class="nav-link">
            Emergency
        </a>

        <a href="/planner.html" class="nav-btn">
            Plan a Trip
        </a>

    </nav>

</header>



    <!-- =====================================================
         MAIN CHAT APPLICATION
    ====================================================== -->

    <div class="chat-layout">


        <!-- =================================================
             SIDEBAR
        ================================================== -->

        <aside class="sidebar">

            <div class="sidebar-content">


                <!-- NEW CHAT -->

                <button
                    type="button"
                    class="new-chat-btn"
                    id="newChatBtn"
                >

                    <span class="new-chat-icon">
                        ＋
                    </span>

                    <span>
                        New Chat
                    </span>

                </button>



                <!-- RECENT CHAT LABEL -->

                <div class="section-label">

                    Recent Chats

                </div>



                <!-- RECENT CHAT LIST -->

                <div
                    class="recent-chats"
                    id="recentList"
                    aria-label="Recent chats"
                >

                    <div class="empty-recent">
                        No chats yet
                    </div>

                </div>

            </div>



            <!-- =================================================
                 LANGUAGE
            ================================================== -->

            <div class="sidebar-footer">

                <div class="language-picker">

                    <span
                        class="language-icon"
                        aria-hidden="true"
                    >
                        🌐
                    </span>

                    <label
                        for="languageSelect"
                        class="sr-only"
                    >
                        Select language
                    </label>

                    <select
                        id="languageSelect"
                        name="language"
                    >

                        <option value="English">
                            English
                        </option>

                        <option value="Hindi">
                            Hindi
                        </option>

                        <option value="Kannada">
                            Kannada
                        </option>

                        <option value="Telugu">
                            Telugu
                        </option>

                        <option value="Tamil">
                            Tamil
                        </option>

                        <option value="Malayalam">
                            Malayalam
                        </option>

                        <option value="Marathi">
                            Marathi
                        </option>

                        <option value="Bengali">
                            Bengali
                        </option>

                    </select>

                </div>

            </div>

        </aside>



        <!-- =================================================
             MAIN CHAT AREA
        ================================================== -->

        <main class="chat-main">


            <!-- =================================================
                 CHAT SCROLL AREA
            ================================================== -->

            <div
                class="chat-scroll-area"
                id="chatScrollArea"
            >

                <div
                    id="resultArea"
                    class="result-area"
                    aria-live="polite"
                >
                </div>

            </div>



            <!-- =================================================
                 MESSAGE COMPOSER
            ================================================== -->

            <div class="composer-container">

                <form
                    class="composer"
                    id="chatForm"
                >

                    <label
                        for="chatInput"
                        class="sr-only"
                    >
                        Ask TravelMate
                    </label>

                    <input
                        id="chatInput"
                        name="message"
                        type="text"
                        autocomplete="off"
                        maxlength="2000"
                        placeholder="Ask about a destination..."
                        aria-label="Ask about a destination"
                    >

                    <button
                        type="submit"
                        class="send-btn"
                        id="sendBtn"
                        aria-label="Send message"
                    >

                        <span>
                            ➤
                        </span>

                    </button>

                </form>


                <div class="composer-hint">

                    Ask about destinations,
                    itineraries, food,
                    transport and travel tips

                </div>

            </div>

        </main>

    </div>

</div>



<!-- =========================================================
     JAVASCRIPT
========================================================= -->

<script src="/static/js/chat.js"></script>

</body>

</html>
