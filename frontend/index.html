<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Tourist Recommendations</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>Tourist Recommendations</h1>

    <p>
        Find useful places near your current location
        or near any place you search.
    </p>


    <!-- CATEGORY -->
    <label for="category">
        What are you looking for?
    </label>

    <select id="category">

        <optgroup label="Food">

            <option value="restaurant">
                🍽 Restaurants
            </option>

            <option value="cafe">
                ☕ Cafes
            </option>

            <option value="fast_food">
                🍔 Fast Food
            </option>

        </optgroup>


        <optgroup label="Stay">

            <option value="hotel">
                🏨 Hotels
            </option>

            <option value="hostel">
                🛏 Hostels
            </option>

            <option value="guest_house">
                🏠 Guest Houses
            </option>

        </optgroup>


        <optgroup label="Tourism">

            <option value="attraction">
                🏛 Tourist Attractions
            </option>

            <option value="museum">
                🖼 Museums
            </option>

            <option value="park">
                🌳 Parks
            </option>

        </optgroup>


        <optgroup label="Shopping">

            <option value="shopping">
                🛍 Shopping Malls
            </option>

            <option value="supermarket">
                🛒 Supermarkets
            </option>

        </optgroup>


        <optgroup label="Essential Services">

            <option value="hospital">
                🏥 Hospitals
            </option>

            <option value="pharmacy">
                💊 Pharmacies
            </option>

            <option value="bank">
                🏦 Banks
            </option>

            <option value="atm">
                💳 ATMs
            </option>

            <option value="fuel">
                ⛽ Fuel Stations
            </option>

            <option value="parking">
                🅿 Parking
            </option>

        </optgroup>

    </select>


    <!-- RADIUS -->
    <label for="radius">
        Search Radius
    </label>

    <select id="radius">
        <option value="1">1 km</option>
        <option value="3">3 km</option>
        <option value="5" selected>5 km</option>
        <option value="10">10 km</option>
    </select>


    <!-- OPTION 1 -->
    <div class="section">

        <h2>📍 Near Me</h2>

        <button id="nearMeBtn">
            Find Places Near Me
        </button>

    </div>


    <!-- OR -->
    <div class="or">
        OR
    </div>


    <!-- OPTION 2 -->
    <div class="section">

        <h2>🔎 Search Near a Place</h2>

        <input
            type="text"
            id="locationInput"
            placeholder="Example: Hyderabad, Charminar, Kompally"
        >

        <button id="searchLocationBtn">
            Search Near This Location
        </button>

    </div>


    <!-- STATUS -->
    <p id="status"></p>


    <!-- SEARCH LOCATION DETAILS -->
    <div id="coordinates"></div>


    <!-- RESULTS -->
    <div id="results"></div>

</div>

<script src="script.js"></script>

</body>
</html>
