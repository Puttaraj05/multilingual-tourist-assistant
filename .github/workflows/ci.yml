name: TravelMate CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  backend-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        run: |
          python -m compileall backend

      - name: Configure environment
        env:
          ENV_SECRET_KEYS: ${{ secrets.ENV_SECRET_KEYS }}
        run: |
          printf '%s\n' "$ENV_SECRET_KEYS" > .env

      - name: Check backend
        run: |
          python -c "from backend.main import app; print('TravelMate backend loaded successfully')"