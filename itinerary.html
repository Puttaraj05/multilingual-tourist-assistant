<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Itinerary | TravelMate</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="itinerary-page">

    <!-- Navigation -->
    <header class="planner-navbar">

        <a href="index.html" class="planner-logo">
            ← TravelMate
        </a>

        <a href="planner.html" class="back-link">
            Edit Trip
        </a>

    </header>

    <!-- Main Content -->
    <main class="itinerary-container">

        <!-- Hero Section -->
        <section class="itinerary-hero">

            <p class="hero-tag" id="planLabel">
                YOUR PERSONALIZED PLAN
            </p>

            <h1 id="destinationTitle">
                Your Destination
            </h1>

            <p class="hero-subtitle">
                Your personalized travel itinerary
            </p>

            <!-- Summary Card -->
            <div class="trip-summary-card">

                <div class="summary-item">
                    <span id="durationLabel">Duration</span>
                    <strong id="summaryDuration">3 Days</strong>
                </div>

                <div class="summary-item">
                    <span id="budgetLabel">Budget</span>
                    <strong id="summaryBudget">$90,000</strong>
                </div>

                <div class="summary-item full-width">
                    <span id="interestsLabel">Interests</span>
                    <strong id="summaryInterests">Food, History, Shopping</strong>
                </div>

            </div>

        </section>

        <!-- AI Generated Itinerary -->
        <div id="itineraryContent">
            <!-- JS will generate day cards here -->
        </div>

        <!-- Bottom Actions -->
        <div class="action-buttons">

            <a href="planner.html" class="action-btn secondary" id="modifyLabel">
                Modify Trip
            </a>

            <button class="action-btn primary" id="saveLabel">
                Save Itinerary
            </button>

        </div>

    </main>

    <script src="js/itinerary.js"></script>

</body>

</html>
